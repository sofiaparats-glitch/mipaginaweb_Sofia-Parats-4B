<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción al Torneo de Handball</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <h1>Inscripción al Torneo de Handball</h1>
        <p>Completa todos los campos para registrar a tu equipo o jugador</p>

        <form action="#" method="POST" id="registroForm">
            <!-- Datos personales -->
            <fieldset>
                <legend>Datos del Jugador</legend>

                <div>
                    <label for="nombre">Nombre completo *</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Martín Gomez" required>
                </div>

                <div>
                    <label for="email">Correo electrónico *</label>
                    <input type="email" id="email" name="email" placeholder="Ej: martin@correo.com" required>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 11 1234-5678">
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                </div>
            </fieldset>

            <!-- Información adicional -->
            <fieldset>
                <legend>Información Deportiva</legend>

                <div>
                    <label for="pais">Categoría / División *</label>
                    <select id="pais" name="categoria" required>
                        <option value="">Selecciona una categoría...</option>
                        <option value="primera">Primera División</option>
                        <option value="juveniles">Juveniles</option>
                        <option value="cadetes">Cadetes</option>
                        <option value="menores">Menores</option>
                        <option value="infantiles">Infantiles</option>
                        <option value="senior">Senior</option>
                    </select>
                </div>

                <div>
                    <label>Posición en la cancha</label>
                    <div>
                        <label>
                            <input type="radio" name="genero" value="arquero">
                            Arquero
                        </label>
                        <label>
                            <input type="radio" name="genero" value="extremo">
                            Extremo
                        </label>
                        <label>
                            <input type="radio" name="genero" value="armador">
                            Armador
                        </label>
                        <label>
                            <input type="radio" name="genero" value="pivot" checked>
                            Pívot
                        </label>
                    </div>
                </div>

                <div>
                    <label>Equipamiento necesario</label>
                    <div>
                        <label>
                            <input type="checkbox" name="intereses" value="pelota">
                            Pelota oficial
                        </label>
                        <label>
                            <input type="checkbox" name="intereses" value="resina">
                            Resina adhesiva
                        </label>
                        <label>
                            <input type="checkbox" name="intereses" value="rodilleras">
                            Rodilleras
                        </label>
                        <label>
                            <input type="checkbox" name="intereses" value="botines">
                            Calzado deportivo
                        </label>
                        <label>
                            <input type="checkbox" name="intereses" value="conjunto">
                            Camiseta y short
                        </label>
                    </div>
                </div>

                <div>
                    <label for="comentarios">Comentarios o historial médico</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Indica alguna lesión previa o club anterior..."></textarea>
                </div>
            </fieldset>

            <!-- Contraseña -->
            <fieldset>
                <legend>Seguridad de la cuenta</legend>

                <div>
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div>
                    <label for="confirmPassword">Confirmar contraseña *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" minlength="8" required>
                </div>
            </fieldset>

            <!-- Términos y condiciones -->
            <div>
                <label>
                    <input type="checkbox" name="terminos" required>
                    Acepto el reglamento del torneo y los <a href="#">términos y condiciones</a> *
                </label>
            </div>

            <!-- Botones -->
            <div>
                <button type="submit">Inscribirse</button>
                <button type="reset">Limpiar formulario</button>
                    <div class="centro" style="margin-top: 30px;">
        <a href="index.html"><button class="btn">Volver al Inicio</button></a>
    </div>
            </div>
        </form>
    </div>
</body>
</html>
